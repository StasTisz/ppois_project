name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'feature/*'
      - 'feature/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Static Analysis & Tests (Ubuntu Linux)
    runs-on: ubuntu-latest

    env:
      VCPKG_DEFAULT_BINARY_CACHE: /home/runner/.cache/vcpkg/archives

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libsqlite3-dev \
            libssl-dev \
            zlib1g-dev \
            libboost-system-dev \
            libcurl4-openssl-dev \
            cppcheck

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/vcpkg/archives
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Locate vcpkg Toolchain
        run: |
          mkdir -p /home/runner/.cache/vcpkg/archives
          VCPKG_ROOT_DIR="$VCPKG_INSTALLATION_ROOT"
          if [ -z "$VCPKG_ROOT_DIR" ]; then
            if [ -d "/usr/local/share/vcpkg" ]; then
              VCPKG_ROOT_DIR="/usr/local/share/vcpkg"
            elif [ -d "$HOME/vcpkg" ]; then
              VCPKG_ROOT_DIR="$HOME/vcpkg"
            fi
          fi
          echo "VCPKG_INSTALLATION_ROOT=$VCPKG_ROOT_DIR" >> $GITHUB_ENV
          echo "VCPKG_ROOT=$VCPKG_ROOT_DIR" >> $GITHUB_ENV

          if [ -n "$VCPKG_ROOT_DIR" ] && [ -d "$VCPKG_ROOT_DIR" ]; then
            git config --global --add safe.directory "$VCPKG_ROOT_DIR" 2>/dev/null || true
            VCPKG_COMMIT=$(git -C "$VCPKG_ROOT_DIR" rev-parse HEAD 2>/dev/null || echo "")
            echo "::notice title=BaselineDetected::VCPKG_ROOT_DIR=$VCPKG_ROOT_DIR, VCPKG_COMMIT=$VCPKG_COMMIT"
            if [ -z "$VCPKG_COMMIT" ]; then
              VCPKG_COMMIT="1460b31b08c42cc2e9ac2c79f45ec8707e2675e2"
            fi
            python3 -c "import json; d=json.load(open('vcpkg.json')); d['builtin-baseline']='$VCPKG_COMMIT'; json.dump(d, open('vcpkg.json','w'), indent=2)"
            echo "Injected vcpkg builtin-baseline: $VCPKG_COMMIT into vcpkg.json"
          fi

      - name: Code Style & Checklist Enforcement
        run: |
          python3 -c '
          import os, sys, re

          dirs = ["include/bot", "src/bot", "src/main.cpp"]
          files_to_check = []
          for d in dirs:
              if os.path.isfile(d):
                  files_to_check.append(d)
              else:
                  for root, _, fs in os.walk(d):
                      for f in fs:
                          if f.endswith((".h", ".cpp")):
                              files_to_check.append(os.path.join(root, f))

          # 1. Line length <= 150
          long_lines = []
          for f in files_to_check:
              with open(f, "r", encoding="utf-8") as file:
                  for i, line in enumerate(file, 1):
                      if len(line.rstrip("\r\n")) > 150:
                          long_lines.append(f"{f}:{i} ({len(line.rstrip())} chars): {line.strip()[:60]}...")
          if long_lines:
              print("Violations: lines > 150 chars:\n" + "\n".join(long_lines))
              sys.exit(1)

          # 2. Function length <= 20 lines
          def find_functions(file_path):
              with open(file_path, "r", encoding="utf-8") as f:
                  lines = f.readlines()
              results = []
              i = 0
              while i < len(lines):
                  line = lines[i]
                  stripped = line.strip()
                  if stripped.startswith(("#", "//", "/*", "*")):
                      i += 1
                      continue
                  if "(" in line and not line.strip().startswith(("for ", "while ", "if ", "switch ")):
                      brace_idx = -1
                      for j in range(i, min(len(lines), i + 8)):
                          if "{" in lines[j]:
                              brace_idx = j
                              break
                          if ";" in lines[j] and "{" not in lines[j]:
                              break
                      if brace_idx != -1:
                          chunk = "".join(lines[i:brace_idx+1])
                          if not re.search(r"\b(class|struct|enum|union|namespace)\b", chunk):
                              start_line = i + 1
                              depth = 0
                              end_line = -1
                              for k in range(brace_idx, len(lines)):
                                  depth += lines[k].count("{") - lines[k].count("}")
                                  if depth == 0:
                                      end_line = k + 1
                                      break
                              if end_line != -1:
                                  length = end_line - start_line + 1
                                  results.append((start_line, end_line, length, lines[i].strip()))
                                  i = end_line
                                  continue
                  i += 1
              return results

          long_funcs = []
          for f in files_to_check:
              for s, e, l, sig in find_functions(f):
                  if l > 20:
                      long_funcs.append(f"{f}:{s}-{e} ({l} lines): {sig}")
          if long_funcs:
              print("Violations: methods > 20 lines:\n" + "\n".join(long_funcs))
              sys.exit(1)

          print("Checklist verification passed: 0 lines > 150 chars, 0 methods > 20 lines!")
          '

      - name: Static Analysis (cppcheck)
        run: |
          cppcheck --enable=warning,performance,portability \
                   --inline-suppr \
                   --suppress=missingInclude \
                   --suppress=missingIncludeSystem \
                   --suppress=unusedFunction \
                   --suppress=unmatchedSuppression \
                   --error-exitcode=0 \
                   --std=c++20 \
                   -I include \
                   src/bot/ src/main.cpp

      - name: Configure CMake with vcpkg
        run: |
          TOOLCHAIN_ARG=""
          if [ -n "$VCPKG_INSTALLATION_ROOT" ] && [ -f "$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" ]; then
            TOOLCHAIN_ARG="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          fi
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            $TOOLCHAIN_ARG

      - name: Build Targets
        run: |
          cmake --build build --config Release --parallel

      - name: Inspect logs on failure
        if: failure()
        run: |
          python3 -c '
          import os
          files = ["build/vcpkg-manifest-install.log", "build/CMakeFiles/CMakeError.log"]
          for f in files:
              if os.path.exists(f):
                  with open(f, encoding="utf-8", errors="ignore") as fp:
                      lines = [line.strip() for line in fp.readlines() if line.strip()]
                  for l in lines[-10:]:
                      print(f"::error title={os.path.basename(f)}::{l[:300]}")
          '

      - name: Execute Tests (ctest)
        run: |
          ctest --test-dir build --output-on-failure -C Release

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: movie-rec-bot-linux-x64
          path: |
            build/movie_rec_bot
            build/movie_rec_tests
            build/data/
